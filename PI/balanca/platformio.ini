; =============================================================================
; PlatformIO Project Configuration
; Projeto: ESP32 + Balança Prix 3 Fit + MongoDB Atlas
; Plataforma: Espressif ESP32 DevKit V1
; IDE: VS Code + PlatformIO Extension
; =============================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ----- Monitor serial --------------------------------------------------------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize, time

; ----- Velocidade de upload --------------------------------------------------
upload_speed = 921600

; ----- Flags de compilação ---------------------------------------------------
build_flags =
    -DCORE_DEBUG_LEVEL=4          ; Habilita logs internos do ESP-IDF (0=nenhum, 5=verbose)
    -DBOARD_HAS_PSRAM=0
    -std=c++17                    ; C++ moderno
    -Wall                         ; Todos os warnings
    -Wextra
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192  ; Stack maior para tarefas pesadas

; ----- Bibliotecas externas --------------------------------------------------
; ArduinoJson: parse/serialize JSON de forma eficiente (sem malloc fragmentado)
; WiFiClientSecure: conexão HTTPS com CA bundle da Espressif
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    ; WiFiClientSecure e HTTPClient fazem parte do esp32 arduino core (já incluídas)
    ; Preferences (NVS) também já está inclusa no core

; ----- Partição de flash -----------------------------------------------------
; default_16MB.csv ou default.csv dependendo do seu módulo
; Se tiver erros de flash size, comente esta linha
board_build.partitions = default.csv

; ----- OTA (Over The Air Update) - opcional ----------------------------------
; Descomente para habilitar OTA via rede
; upload_protocol = espota
; upload_port     = 192.168.1.XXX  ; IP do ESP32 na rede
