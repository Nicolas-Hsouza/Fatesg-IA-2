version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: etl_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - etl_network

  postgres:
    image: postgres:latest
    container_name: etl_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: etl_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - etl_network

volumes:
  mongodb_data:
  postgres_data:

networks:
  etl_network:
    driver: bridge
