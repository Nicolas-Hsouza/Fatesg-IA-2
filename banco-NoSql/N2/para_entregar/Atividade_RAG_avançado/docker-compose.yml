version: '3.8'

services:
  jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      # Montar o diretório local de dados para acesso ao CSV
      - ./Data:/app/Data
    environment:
      - QDRANT_URL=http://qdrant:6333
      - CSV_PATH=/app/Data/quikr_car.csv
      # Caso queira passar a chave por .env, crie um .env na pasta atual com MARITACA_API_KEY=xxx
    env_file:
      - .env
    depends_on:
      - qdrant
    networks:
      - rag_network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_network

volumes:
  qdrant_data:

networks:
  rag_network:
